name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: "arc-runners"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # dist/ and dist-cli/ are gitignored and built by the release workflow.
      # CI only proves the bundles still build.
      - name: build bundles
        run: npm run build && npm run build:cli
      - name: docker build (smoke)
        run: docker build -t naoru:ci .
