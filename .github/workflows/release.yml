name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: "arc-runners"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci && npm run build && npm run build:cli
      # dist/ is gitignored on main, but `uses: clouddrove/naoru@v0` runs
      # dist/index.js straight off the tag — so the bundles are built here and
      # committed onto the tag itself. Pushing with GITHUB_TOKEN does not
      # re-trigger this workflow, so moving the tag can't loop.
      - name: commit bundles onto the release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist dist-cli
          git commit -m "build: bundle dist for ${GITHUB_REF_NAME}"
          git tag -f "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v3
      - name: log in to ghcr
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/clouddrove/naoru:${{ github.ref_name }}
            ghcr.io/clouddrove/naoru:latest
      - name: move major tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" && git push -f origin "$MAJOR"
